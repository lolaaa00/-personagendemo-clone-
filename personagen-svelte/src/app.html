<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<script>
			/*
			 * The viewer's time zone, for the server to render instants in. A browser
			 * with no `tz` cookie yet sets it and reloads ONCE before anything
			 * paints, so even the very first page is in the viewer's zone rather than
			 * the server's (round-4 re-audit: a 12-hour jump on first visit). The
			 * sessionStorage flag stops any second reload if the cookie cannot be
			 * written (blocked site data).
			 */
			try {
				var tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
				var m = /(?:^|; )tz=([^;]*)/.exec(document.cookie);
				// Missing OR stale (a laptop that flew: the cookie said New York, the
				// clock says Manila — round-5 re-audit). One reload per zone, ever.
				if (tz && (!m || decodeURIComponent(m[1]) !== tz) && sessionStorage.getItem('tz-reload') !== tz) {
					sessionStorage.setItem('tz-reload', tz);
					document.cookie = 'tz=' + tz + '; path=/; max-age=31536000; samesite=lax';
					if (new RegExp('(?:^|; )tz=' + tz.replace(/[/+]/g, '\\$&')).test(document.cookie)) location.replace(location.href);
				}
			} catch (e) {
				/* no Intl zone or storage — the server keeps its default */
			}
			/*
			 * Set the theme before first paint.
			 *
			 * initializeThemeAndColors() already honours `prefers-color-scheme`,
			 * but it runs in onMount — after hydration. The server renders no
			 * `data-theme`, so a dark-mode user got a full white screen on every
			 * cold load and watched it flip. For a tool people sit in for hours
			 * that is the first impression, every time.
			 *
			 * Deliberately inline and synchronous: any deferred script paints
			 * white first, which is the whole problem. Wrapped because a browser
			 * with site data blocked throws on localStorage access.
			 */
			(function () {
				try {
					var saved = localStorage.getItem('personagen_theme');
					var dark = saved
						? saved === 'dark'
						: window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
					document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
				} catch (e) {
					/* storage unavailable — the client init will settle it after hydration */
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
