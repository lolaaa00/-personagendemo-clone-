services:
  # Supabase MCP Bridge — gives Hermes DB access to PersonaGen
  mcp-bridge:
    build:
      context: ./services/mcp-bridge
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - SUPABASE_URL=${PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - MCP_BRIDGE_TOKEN=${MCP_BRIDGE_TOKEN}

  # NousResearch Hermes Agent Daemon
  hermes:
    image: nousresearch/hermes-agent:latest
    restart: unless-stopped
    ports:
      - "8642:8642"
    volumes:
      - hermes-memories:/opt/data
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}
      - MCP_BRIDGE_TOKEN=${MCP_BRIDGE_TOKEN}
      - API_SERVER_ENABLED=true
      - API_SERVER_KEY=${HERMES_API_KEY}
      - API_SERVER_PORT=8642
    command: >
      bash -c "
        hermes setup --non-interactive &&
        hermes gateway run --mcp-server http://mcp-bridge:8000/sse?token=$${MCP_BRIDGE_TOKEN}"
    depends_on:
      - mcp-bridge

volumes:
  hermes-memories:
