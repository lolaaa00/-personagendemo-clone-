services:
  # 1. Main SvelteKit Application Frontend & SSR
  app:
    build:
      context: ./personagen-svelte # Correct build context to isolate files
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "5678"  # Shifts container port to 5678, avoiding any host conflicts with Easypanel (which uses 3000)
    environment:
      - PORT=5678 # Instructs SvelteKit Node adapter to bind to port 5678
      - NODE_ENV=production
      - PUBLIC_SUPABASE_URL=https://l2g-supabase.zi1cc5.easypanel.host
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - COMPOSIO_API_KEY=${COMPOSIO_API_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}

  # 2. Account Factory Background Scheduler
  factory:
    build:
      context: ./services/factory # Correct build context to isolate files
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PUBLIC_SUPABASE_URL=https://l2g-supabase.zi1cc5.easypanel.host
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}

  # 3. Mail Notification Service
  mail:
    build:
      context: ./services/mail # Correct build context to isolate files
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PUBLIC_SUPABASE_URL=https://l2g-supabase.zi1cc5.easypanel.host
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}

  # 4. Custom Supabase MCP Bridge (Enables DB access for Hermes)
  mcp-bridge:
    build:
      context: ./services/mcp-bridge # Correct build context to isolate files
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"  # Exposed purely internally inside the virtual network
    environment:
      - SUPABASE_URL=https://l2g-supabase.zi1cc5.easypanel.host
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_ROLE_KEY}

  # 5. Official NousResearch Hermes Agent Daemon
  hermes:
    image: nousresearch/hermes-agent:latest # Pulls from public Docker Hub
    restart: unless-stopped
    volumes:
      # Mounts the host volume to /opt/data, which is the official container persistence target
      - hermes-memories:/opt/data
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}
    # Command to boot the official background gateway daemon and link the MCP bridge
    command: >
      bash -c "
        hermes setup --non-interactive &&
        hermes gateway run --mcp-server http://mcp-bridge:8000/sse"

volumes:
  # Persist sessions, memories, skills, and configuration securely
  hermes-memories:
